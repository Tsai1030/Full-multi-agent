services:
  postgres:
    image: postgres:16-alpine
    container_name: ziwei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ziwei
      POSTGRES_PASSWORD: ziwei_dev_pw
      POSTGRES_DB: ziwei
    ports:
      - "5432:5432"
    volumes:
      - ziwei_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziwei -d ziwei"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ziwei_pgdata:
