[project]
name = "ziwei-multi-agent-backend"
version = "2.0.0"
description = "紫微斗數 Multi-Agent AI 後端（LangGraph + Gemini + RAG）"
readme = "../README.md"
requires-python = ">=3.10"

dependencies = [
    # ── AI / LLM（Gemini 為主）──────────────────────────────
    "langchain-google-genai>=2.0.0",
    "google-generativeai>=0.8.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.50",

    # ── Vector Store ───────────────────────────────────────
    "chromadb>=0.5.0",

    # ── Database / Auth ────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.1.0",

    # ── Web Search ─────────────────────────────────────────
    "tavily-python>=0.3.0",

    # ── HTTP / 解析 ────────────────────────────────────────
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",

    # ── Web Framework ──────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.29.0",

    # ── Config / Env ───────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # ── Logging / Async ────────────────────────────────────
    "loguru>=0.7.0",
    "aiofiles>=23.2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
